<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hello, world</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=DM+Sans:wght@400;500;600&display=swap">
<style>
  /* Layout: one centred column, heading, sentence, full-width tap target. */
  :root {
    --bg: #eef3f1;
    --surface: #ffffff;
    --fg: #14211e;
    --muted: #4d625d;
    --accent: #0e7c66;
    --accent-fg: #ffffff;
    --ring: #0e7c66;
    --font-display: "Bricolage Grotesque", "Helvetica Neue", Arial, sans-serif;
    --font-body: "DM Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0f1917;
      --surface: #16241f;
      --fg: #e6f0ed;
      --muted: #9db3ad;
      --accent: #3fd1b0;
      --accent-fg: #07211b;
      --ring: #3fd1b0;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0f1917;
    --surface: #16241f;
    --fg: #e6f0ed;
    --muted: #9db3ad;
    --accent: #3fd1b0;
    --accent-fg: #07211b;
    --ring: #3fd1b0;
    color-scheme: dark;
  }

  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--fg);
    font-family: var(--font-body);
    padding-block: 24px;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    display: flex;
    align-items: center;
    justify-content: center;
    box-sizing: border-box;
  }
  main {
    width: 100%;
    max-width: 420px;
    min-width: 0;
    display: flex;
    flex-direction: column;
    gap: 24px;
  }
  h1 {
    margin: 0;
    font-family: var(--font-display);
    font-weight: 800;
    font-size: clamp(2.75rem, 14vw, 4.25rem);
    line-height: 1;
    letter-spacing: -0.03em;
    text-wrap: balance;
  }
  .card {
    background: var(--surface);
    border-radius: 20px;
    padding: 24px 22px;
    min-height: 7.5rem;
    display: flex;
    align-items: center;
    box-shadow: 0 1px 0 color-mix(in srgb, var(--fg) 8%, transparent);
  }
  #sentence {
    margin: 0;
    font-size: 1.25rem;
    line-height: 1.5;
    font-weight: 500;
    color: var(--fg);
    text-wrap: pretty;
    overflow-wrap: anywhere;
  }
  #sentence.swap { animation: rise 280ms ease-out; }
  @keyframes rise {
    from { opacity: 0; transform: translateY(6px); }
    to { opacity: 1; transform: none; }
  }
  button {
    font: inherit;
    font-weight: 600;
    font-size: 1.0625rem;
    min-height: 56px;
    border: 0;
    border-radius: 14px;
    background: var(--accent);
    color: var(--accent-fg);
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
    transition: transform 120ms ease;
  }
  button:active { transform: scale(0.98); }
  button:focus-visible { outline: 3px solid var(--ring); outline-offset: 3px; }
  @media (prefers-reduced-motion: reduce) {
    #sentence.swap { animation: none; }
    button { transition: none; }
  }
</style>

</head>
<body>
<main>
  <h1>Hello, world</h1>
  <div class="card">
    <p id="sentence" aria-live="polite">The sun is out, so it's a lovely day for a walk.</p>
  </div>
  <button id="again" type="button">Say something else</button>
</main>

<script>
  (function () {
    var lines = [
      "The sun is out, so it's a lovely day for a walk.",
      "A soft drizzle is falling, perfect for staying in with a warm drink.",
      "Clouds are drifting by slowly, and the breeze feels gentle.",
      "There's a crisp chill in the air, so a cosy jumper is a good idea.",
      "The morning fog is lifting and the day is starting to glow.",
      "A warm wind is blowing, and the afternoon feels easy.",
      "Rain is tapping on the window, which makes everything feel calm.",
      "The sky is clear tonight, so the stars should be shining."
    ];
    var current = 0;
    var el = document.getElementById("sentence");
    var btn = document.getElementById("again");
    btn.addEventListener("click", function () {
      var next = current;
      while (next === current) next = Math.floor(Math.random() * lines.length);
      current = next;
      el.classList.remove("swap");
      void el.offsetWidth;
      el.textContent = lines[current];
      el.classList.add("swap");
    });
  })();
</script>
</body>
</html>
